name: FlowGuard AI CI & PR Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Run Vitest unit & integration suite (52 tests)
        run: npm test

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E, Accessibility & Responsive test suite (33 tests)
        run: npx playwright test

      - name: Upload Playwright Test Artifacts, Traces & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
