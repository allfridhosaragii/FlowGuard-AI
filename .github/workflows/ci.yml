name: FlowGuard AI CI & PR Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/testsprite-s4-hardening ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build

      - name: Run Vitest unit & integration suite
        run: npm test

      - name: Install Playwright browser dependencies
        run: |
          if npx playwright install --with-deps chromium; then
            exit 0
          fi

          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser_path" ]; then
            echo "Playwright Chromium installation failed and no system browser is available." >&2
            exit 1
          fi

          echo "Playwright Chromium installation failed; using system browser at $browser_path."
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Run Playwright E2E, Accessibility, Responsive & Mobile Emulation suite
        run: npx playwright test --config=playwright.audit.config.ts

      - name: Upload Playwright Test Artifacts, Traces & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
