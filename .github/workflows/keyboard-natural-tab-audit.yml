name: Natural Keyboard Proof (isolated audit branch)

on:
  push:
    branches:
      - audit/keyboard-natural-tab-20261024

permissions:
  contents: read

jobs:
  natural-tab-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build locally
        run: npm run build
      - name: Execute real keyboard proof without TestSprite credits
        run: npx playwright test tests/keyboard-natural-tab-audit.spec.ts --config=playwright.config.ts --project=chromium --workers=1 --retries=0
      - name: Verify the actual public PR 14 Vercel preview with keyboard only
        env:
          PLAYWRIGHT_BASE_URL: https://flowguard-ai-git-docs-15dd3a-pedoprimasaragi-gmailcoms-projects.vercel.app
        run: npx playwright test tests/keyboard-natural-tab-audit.spec.ts --config=playwright.config.ts --project=chromium --workers=1 --retries=0
      - name: Verify the current production deployment with keyboard only
        env:
          PLAYWRIGHT_BASE_URL: https://flowguard-ai-smoky.vercel.app
        run: npx playwright test tests/keyboard-natural-tab-audit.spec.ts --config=playwright.config.ts --project=chromium --workers=1 --retries=0
      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-tab-proof
          path: |
            test-results/
            playwright-report/
          retention-days: 7
