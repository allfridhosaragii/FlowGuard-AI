name: S4 Route Focus Regression - Isolated No TestSprite
on:
  push:
    branches: [staging/s4-nav-to-form-zod4-20261025]
    paths: [.github/workflows/s4-nav-to-form-focus-proof.yml]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Full Chromium regression on isolated production build
        env:
          CI: 'true'
        run: npx playwright test --config=playwright.audit.config.ts --workers=1 --retries=0
      - name: Start HTTPS with unchanged production CSP
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/ux002-key.pem -out /tmp/ux002-cert.pem -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/ux002-next.log 2>&1 &
          UX002_TLS_KEY=/tmp/ux002-key.pem UX002_TLS_CERT=/tmp/ux002-cert.pem node scripts/ux002-tls-proxy.mjs > /tmp/ux002-proxy.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -k -fsS https://localhost:3443/api/v1/health >/dev/null; then break; fi
            sleep 2
          done
          curl -k -fsS https://localhost:3443/api/v1/health
      - name: Cross-browser UX-002 and navigation-to-form checks
        env:
          PLAYWRIGHT_BASE_URL: https://localhost:3443
        run: npx playwright test tests/ux002-full-keyboard-audit.spec.ts --config=playwright.ux002.browser-audit.config.ts --workers=1 --retries=0
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4-nav-to-form-ux002-isolated
          path: |
            test-results/
            playwright-report/
          retention-days: 7
