name: S4 Patched Vercel Preview UX-002 (no TestSprite)

on:
  push:
    branches:
      - staging/s4-pr14-keyboard-integration-20261024
    paths:
      - .github/workflows/s4-hosted-preview-ux002.yml
      - tests/ux002-full-keyboard-audit.spec.ts
      - src/app/analyze/page.tsx
      - src/app/lab/page.tsx
      - src/components/ScenarioAuditPanel.tsx

permissions:
  contents: read

jobs:
  hosted-chromium-firefox-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Install Chromium Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify preview is real application and anonymously accessible
        shell: bash
        env:
          PREVIEW_URL: https://flowguard-ai-git-stag-3631de-pedoprimasaragi-gmailcoms-projects.vercel.app
        run: |
          set -euo pipefail
          for path in / /analyze /lab /about /api/v1/health; do
            url="$PREVIEW_URL$path"
            status=$(curl -fsSL --retry 4 --retry-delay 5 --max-time 30 -o /tmp/ux002-response -w '%{http_code}' "$url")
            [ "$status" = '200' ] || exit 1
            if [ "$path" = '/api/v1/health' ]; then
              node -e 'const fs=require("node:fs");const j=JSON.parse(fs.readFileSync("/tmp/ux002-response","utf8"));if(j.status!=="ok")process.exit(1);'
            else
              grep -qi 'FlowGuard AI' /tmp/ux002-response
            fi
            echo "STAGING_PUBLIC_OK $status $path"
          done
      - name: Seven actual-Tab UX-002 tests in each engine against live staging Vercel
        env:
          PLAYWRIGHT_BASE_URL: https://flowguard-ai-git-stag-3631de-pedoprimasaragi-gmailcoms-projects.vercel.app
        run: npx playwright test tests/ux002-full-keyboard-audit.spec.ts --config=playwright.ux002.browser-audit.config.ts --workers=1 --retries=0
      - name: Upload browser traces screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4-staging-hosted-ux002-three-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
