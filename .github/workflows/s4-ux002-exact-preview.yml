name: Season 4 UX002 Exact Preview Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/analyze/page.tsx'
      - 'tests/ux002-full-keyboard-audit.spec.ts'
      - '.github/workflows/s4-ux002-exact-preview.yml'
  workflow_dispatch:

jobs:
  exact-preview-native-keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: https://flowguard-ai-git-fix-9ccffa-pedoprimasaragi-gmailcoms-projects.vercel.app
    steps:
      - name: Checkout exact change
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify deployed URL includes the current accessibility improvement
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            http_status="$(curl --location --silent --show-error --max-time 25 \
              --output "$RUNNER_TEMP/flowguard-preview.html" --write-out '%{http_code}' \
              "${PLAYWRIGHT_BASE_URL}/analyze")"
            echo "Preview response: HTTP $http_status; bytes: $(wc -c < "$RUNNER_TEMP/flowguard-preview.html")"
            if grep -Fq 'id="code-snippet-help"' "$RUNNER_TEMP/flowguard-preview.html" \
              && grep -Fq 'Tab past the sample buttons' "$RUNNER_TEMP/flowguard-preview.html"; then
              echo "Verified target deployment contains the PR-specific accessibility improvement."
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              grep -oE '<title>[^<]{0,160}</title>' "$RUNNER_TEMP/flowguard-preview.html" | head -1 || true
              grep -oE 'Authentication Required|DEPLOYMENT_NOT_FOUND|code-snippet-help|Pull Request &amp; Code' "$RUNNER_TEMP/flowguard-preview.html" | head -4 || true
            fi
            echo "Not yet at expected version (${attempt}/6)"
            sleep 12
          done
          echo "::error::Hosted preview did not prove current source; no green assertion may be reported." >&2
          exit 1
      - name: Real hosted Chromium keyboard and validation regression
        run: npx playwright test tests/ux002-full-keyboard-audit.spec.ts --grep 'UX002-REGRESSION-' --project=chromium
      - name: Upload independent traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux002-hosted-new-branch-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
