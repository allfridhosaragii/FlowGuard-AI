name: UX-002 Cross-Browser (isolated audit, no TestSprite)

on:
  push:
    branches:
      - audit/a11y-ux002-cross-browser-20261024

permissions:
  contents: read

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Create ephemeral local TLS certificate and start Next and HTTPS proxy
        shell: bash
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/ux002-key.pem -out /tmp/ux002-cert.pem \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/ux002-next.log 2>&1 &
          echo "UX002_NEXT_PID=$!" >> "$GITHUB_ENV"
          export UX002_TLS_KEY=/tmp/ux002-key.pem UX002_TLS_CERT=/tmp/ux002-cert.pem
          node scripts/ux002-tls-proxy.cjs > /tmp/ux002-proxy.log 2>&1 &
          echo "UX002_PROXY_PID=$!" >> "$GITHUB_ENV"
          for n in $(seq 1 60); do
            if curl -k -fsS https://localhost:3443/api/v1/health > /dev/null; then
              echo "PRODUCTION_BUILD_HTTPS_LOCAL_READY"
              break
            fi
            sleep 2
          done
          curl -k -fsS https://localhost:3443/api/v1/health
          echo
          curl -k -fsS -D - -o /dev/null https://localhost:3443/analyze | grep -Ei 'HTTP/|content-security-policy' | head -n 3
      - name: Execute unchanged 7 UX-002 tests in Chromium Firefox WebKit over HTTPS
        env:
          PLAYWRIGHT_BASE_URL: https://localhost:3443
        run: npx playwright test tests/ux002-full-keyboard-audit.spec.ts --config=playwright.ux002.browser-audit.config.ts --workers=1 --retries=0
      - name: Store traces screenshots and backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux002-https-cross-browser-proof
          path: |
            test-results/
            playwright-report/
            /tmp/ux002-next.log
            /tmp/ux002-proxy.log
          retention-days: 7
