name: UX-002 Cross-Browser (isolated audit, no TestSprite)

on:
  push:
    branches:
      - audit/a11y-ux002-cross-browser-20261024

permissions:
  contents: read

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Real UX-002 keyboard travel in Chromium, Firefox and WebKit
        run: npx playwright test tests/ux002-key-events-diagnostic.spec.ts --config=playwright.ux002.browser-audit.config.ts --workers=1 --retries=0
      - name: Store detailed traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux002-cross-browser-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
