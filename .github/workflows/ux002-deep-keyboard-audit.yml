name: UX-002 Deep Keyboard Proof (isolated fix branch)

on:
  push:
    branches:
      - fix/a11y-ux002-deep-audit-20261024

permissions:
  contents: read

jobs:
  prove-ux002:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Execute UX-002 full path and stress-focus tests
        run: npx playwright test tests/ux002-full-keyboard-audit.spec.ts --config=playwright.config.ts --project=chromium --workers=1 --retries=0
      - name: Upload browser proof (traces/screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux002-full-keyboard-proof
          path: |
            test-results/
            playwright-report/
          retention-days: 7
